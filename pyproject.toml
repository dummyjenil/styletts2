[project]
name = "styletts2"
version = "0.1.0"
description = "Implementation of STYLETTS2"
readme = "README.md"
authors = [
    { name = "Sheth Jenil", email = "shethjeniljigneshbhai@gmail.com" }
]
dependencies = []

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "PL",  # pylint
    "RUF", # ruff-specific rules
    "N",   # pep8-naming
    "S",   # security (bandit)
]

ignore = [
    "PLR0913", # Too many arguments
    "PLR0915", # Too many statements
    "N812",    # Lowercase imported as uppercase
    "PLR2004", # Magic values
    "E501",    # Line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["styletts2"]
combine-as-imports = true

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "PLR2004", # magic values allowed in tests
]

[tool.mypy]
python_version = "3.9"
strict = true